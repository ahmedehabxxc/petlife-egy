<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PetLife</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; padding: 28px 18px; background: #0b1020; color: #e5e7eb; }
    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { margin: 0 0 10px; font-size: 1.6rem; }
    p { margin: 0 0 14px; color: #cbd5e1; line-height: 1.5; }
    a { color: #22c55e; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { background: rgba(15,23,42,0.7); padding: 2px 6px; border-radius: 6px; }
    .card { margin-top: 14px; padding: 14px 14px; border-radius: 14px; border: 1px solid rgba(148,163,184,0.25); background: rgba(2,6,23,0.7); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>PetLife backend is running</h1>
    <p>
      API: <code>/api</code> • Swagger: <a href="/swagger">/swagger</a> • Tester: <a href="/tester.html">/tester.html</a>
    </p>
    <div class="card">
      <p>
        To show the full React frontend here at <code>/</code>, build it and copy the frontend <code>dist</code> output into <code>wwwroot</code>.
      </p>
    </div>
  </div>
</body>
</html>
